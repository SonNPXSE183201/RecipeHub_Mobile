[project]
name = "recipehub-e2e"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pytest",
  "pytest-asyncio",
  "python-dotenv",
  "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
addopts = "--tb=short --show-capture=no"
markers = [
  "slow: device E2E task driven by ARTEMIS",
  "manual: requires an operator to send an external notification",
]
